<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<body>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {FullScreenQuad} from 'three/addons/postprocessing/Pass.js';

/* ============================================================
   PK 貓貓 · Ctrl+C. Ctrl+V. Ctrl+V. Then Ctrl+Z.
   1920x1080 · 60 fps · 14.0 s = 840 frames · seamless loop
   window.renderAt(t) is a pure function of t (seeded random only)
   ?t=<sec> freezes a frame · ?render=1 hands the frame loop to tools
   ============================================================ */

const W = 1920, H = 1080, FPS = 60, DUR = 14, NF = 840;
const U = 1.905;                         // key pitch, cm
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const FREEZE = Q.has('t') ? parseFloat(Q.get('t')) : null;
const TAU = Math.PI * 2;

/* ---------- utils ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const mod = (a, n) => ((a % n) + n) % n;
const deg = d => d * Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function cv(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); if (draw) draw(g, w, h); return c; }
function tex(c, srgb = true, repeat = false) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);
const camera = new THREE.PerspectiveCamera(28.4, W / H, 2, 400);   // 40 mm equiv. on 36 mm sensor → 28.4° vertical

/* ---------- environment (warm lamp softbox, cool monitor panel, dark room) ---------- */
let envTex = null;
(function makeEnv() {
  const s = new THREE.Scene(); s.background = new THREE.Color(0x0a0809);
  const panel = (c, i, w, h, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide}));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(0xffb472, 16, 34, 26, [-46, 44, 30]);     // lamp
  panel(0x7aa4ff, 5, 60, 30, [14, 26, -70]);      // monitor
  panel(0xffd6a8, 2.4, 40, 20, [60, 18, 20]);     // bounce
  panel(0x5a3a28, 1.2, 160, 160, [0, -40, 0]);    // warm desk below
  const pm = new THREE.PMREMGenerator(renderer);
  envTex = pm.fromScene(s, 0.035).texture;     // only glossy parts sample it (IBL on every pixel is far too slow on CPU)
})();

/* ---------- lights ---------- */
const lamp = new THREE.SpotLight(0xffcf9e, 4.4, 0, deg(46), 0.9, 0);
lamp.position.set(-17, 27, 17);
lamp.target.position.set(10, 1.5, 4.5);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1536, 1536);
lamp.shadow.camera.near = 8; lamp.shadow.camera.far = 90;
lamp.shadow.bias = -0.0004; lamp.shadow.normalBias = 0.03; lamp.shadow.radius = 4;
scene.add(lamp, lamp.target);
const monFill = new THREE.DirectionalLight(0x86a8ff, 0.9);      // cool monitor fill / rim from behind (one cheap light instead of two)
monFill.position.set(16, 22, -20); scene.add(monFill);
const rim = monFill;
scene.add(new THREE.HemisphereLight(0x9aa8ff, 0x7a5a45, 1.05));

/* ---------- desk, mat ---------- */
const desk = new THREE.Mesh(new THREE.PlaneGeometry(400, 300),
  new THREE.MeshStandardMaterial({color: 0x2a1d17, roughness: 0.55, metalness: 0, envMapIntensity: 0.5, map: tex(cv(512, 512, (g, w, h) => {
    g.fillStyle = '#4a3428'; g.fillRect(0, 0, w, h);
    const r = mulberry32(7);
    for (let i = 0; i < 900; i++) { g.strokeStyle = `rgba(${r() < .5 ? '20,10,6' : '110,80,55'},${0.05 + r() * .08})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const y = r() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + r() * 12 - 6, w * .7, y + r() * 12 - 6, w, y + r() * 8 - 4); g.stroke(); }
  }), true, true)}));
desk.material.map.repeat.set(10, 8);
desk.rotation.x = -Math.PI / 2; desk.position.set(10, 0, 0); desk.receiveShadow = true;
scene.add(desk);

const MAT_Y = 0.30;
const matTexC = cv(2048, 1024, (g, w, h) => {
  g.fillStyle = '#3b3f48'; g.fillRect(0, 0, w, h);
  const r = mulberry32(21);
  for (let i = 0; i < 90000; i++) { const v = r() < .5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${r() * .05})`; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2); }
  g.setLineDash([14, 11]); g.lineWidth = 5; g.strokeStyle = '#c9bfa8'; g.lineCap = 'round';
  const m = 38, rad = 70;
  g.beginPath(); g.roundRect(m, m, w - 2 * m, h - 2 * m, rad); g.stroke();
});
const matTex = tex(matTexC);
const mat = new THREE.Mesh(new RoundedBoxGeometry(80, MAT_Y, 40, 2, 0.12), new THREE.MeshStandardMaterial({color: 0x30343c, roughness: 0.96, envMapIntensity: 0.4}));
mat.position.set(10, MAT_Y / 2, 3); mat.receiveShadow = true; scene.add(mat);
const matTop = new THREE.Mesh(new THREE.PlaneGeometry(80 - 0.2, 40 - 0.2), new THREE.MeshStandardMaterial({map: matTex, roughness: 0.97, envMapIntensity: 0.4}));
matTop.rotation.x = -Math.PI / 2; matTop.position.set(10, MAT_Y + 0.005, 3); matTop.receiveShadow = true; scene.add(matTop);

/* ---------- keyboard ---------- */
const PLATE_Y = 1.0, CAP_H = 0.8, CAP_UP = 1.4, TRAVEL = 0.4;
const CAP_TOP = CAP_UP + CAP_H;          // 2.2 : where the toys stand
const ROWS = [
  [['`', 1], ['1', 1], ['2', 1], ['3', 1], ['4', 1], ['5', 1], ['6', 1], ['7', 1], ['8', 1], ['9', 1], ['0', 1], ['-', 1], ['=', 1], ['Bksp', 2, 'back']],
  [['Tab', 1.5, 'tab'], ['Q', 1], ['W', 1], ['E', 1], ['R', 1], ['T', 1], ['Y', 1], ['U', 1], ['I', 1], ['O', 1], ['P', 1], ['[', 1], [']', 1], ['\\', 1.5]],
  [['Caps Lock', 1.75, 'caps'], ['A', 1], ['S', 1], ['D', 1], ['F', 1], ['G', 1], ['H', 1], ['J', 1], ['K', 1], ['L', 1], [';', 1], ["'", 1], ['Enter', 2.25, 'enter']],
  [['Shift', 2.25, 'shiftL'], ['Z', 1], ['X', 1], ['C', 1], ['V', 1], ['B', 1], ['N', 1], ['M', 1], [',', 1], ['.', 1], ['/', 1], ['Shift', 2.75, 'shiftR']],
  [['Ctrl', 1.25, 'ctrlL'], ['Win', 1.25, 'win'], ['Alt', 1.25, 'altL'], ['', 6.25, 'space'], ['Alt', 1.25, 'altR'], ['Fn', 1.25, 'fn'], ['Menu', 1.25, 'menu'], ['Ctrl', 1.25, 'ctrlR']]
];
const KEYS = {};            // id → key record
const keyList = [];
const noiseBumpC = cv(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); const r = mulberry32(3);
  for (let i = 0; i < 9000; i++) { const v = 90 + r() * 80; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r() * w, r() * h, 1 + r() * 1.5, 1 + r() * 1.5); }
});
const noiseBump = tex(noiseBumpC, false, true); noiseBump.repeat.set(1.2, 1.2);

const capMat = new THREE.MeshStandardMaterial({color: 0x2e3036, roughness: 0.62, metalness: 0});
const capMatWorn = new THREE.MeshStandardMaterial({color: 0x34373e, roughness: 0.30, metalness: 0});
const housingMat = new THREE.MeshStandardMaterial({color: 0x23252b, roughness: 0.45, metalness: 0, envMapIntensity: 0.6});
const stemMat = new THREE.MeshStandardMaterial({color: 0x9a3b2f, roughness: 0.5});
const capGeoCache = {};
function capGeo(w) {
    if (capGeoCache[w]) return capGeoCache[w];
  const g = new RoundedBoxGeometry(w * U - 0.14, CAP_H, U - 0.14, 3, 0.17);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const f = (p.getY(i) + CAP_H / 2) / CAP_H;                 // 0 bottom → 1 top
    p.setX(i, p.getX(i) * lerp(1, 0.80, f));
    p.setZ(i, p.getZ(i) * lerp(1, 0.74, f));
  }
  g.computeVertexNormals();
  return capGeoCache[w] = g;
}
const LEG_FLAT = w => (w * U - 0.14) * 0.80 - 0.34;
function legendTex(label, w) {
  const pw = LEG_FLAT(w), ph = (U - 0.14) * 0.74 - 0.34, S = 210;
  const c = cv(Math.round(pw * S), Math.round(ph * S), (g, cw, ch) => {
    g.clearRect(0, 0, cw, ch); g.fillStyle = '#f4f6fa'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const word = label.length > 1;
    g.font = `${word ? 600 : 700} ${Math.round(ch * (word ? 0.34 : 0.62))}px Inter, "Helvetica Neue", Arial, sans-serif`;
    if (label === 'Caps Lock') { g.fillText('Caps', cw / 2, ch * 0.38); g.fillText('Lock', cw / 2, ch * 0.66); }
    else g.fillText(label, cw / 2, ch * 0.54);
  });
  const t = tex(c); t.anisotropy = 16; return {map: t, pw, ph};
}
const kbRoot = new THREE.Group(); scene.add(kbRoot);
ROWS.forEach((row, ri) => {
  let x = 0;
  row.forEach(([label, w, id]) => {
    id = id || label;
    const cx = (x + w / 2) * U, cz = (ri + 0.5) * U;
    const g = new THREE.Group(); g.position.set(cx, 0, cz); kbRoot.add(g);
    const hs = new THREE.Mesh(new RoundedBoxGeometry(1.45, 0.52, 1.45, 2, 0.1), housingMat); hs.position.y = PLATE_Y + 0.26; hs.castShadow = hs.receiveShadow = true; g.add(hs);
    const worn = 'WASD'.includes(id) && id.length === 1;
    const cap = new THREE.Mesh(capGeo(w), worn ? capMatWorn : capMat); cap.castShadow = cap.receiveShadow = true; g.add(cap);
    const lg = legendTex(label, w);
    const lmat = new THREE.MeshStandardMaterial({map: lg.map, transparent: true, roughness: 0.5, metalness: 0, emissive: new THREE.Color(0x66ffe0), emissiveMap: lg.map, emissiveIntensity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2});
    const leg = new THREE.Mesh(new THREE.PlaneGeometry(lg.pw, lg.ph), lmat); leg.rotation.x = -Math.PI / 2; leg.renderOrder = 2; g.add(leg);
    const k = {id, label, w, row: ri, cx, cz, g, cap, leg, lmat, press: 0, glow: 0, topX: cx, topZ: cz};
    KEYS[id] = k; keyList.push(k);
    x += w;
  });
});
// case + plate
const kbW = 15 * U, kbD = 5 * U;
const caseMat = new THREE.MeshStandardMaterial({color: 0x1b1c21, roughness: 0.4, metalness: 0.25});
const kcase = new THREE.Mesh(new RoundedBoxGeometry(kbW + 1.9, PLATE_Y - MAT_Y + 0.05, kbD + 1.9, 3, 0.3), caseMat);
kcase.position.set(kbW / 2, MAT_Y + (PLATE_Y - MAT_Y + 0.05) / 2 - 0.05, kbD / 2); kcase.castShadow = kcase.receiveShadow = true; kbRoot.add(kcase);
const plate = new THREE.Mesh(new RoundedBoxGeometry(kbW + 0.5, 0.12, kbD + 0.5, 2, 0.05), new THREE.MeshStandardMaterial({color: 0x101114, roughness: 0.5, metalness: 0.3}));
plate.position.set(kbW / 2, PLATE_Y - 0.02, kbD / 2); plate.receiveShadow = true; kbRoot.add(plate);
// Ctrl glow halo
const haloTex = tex(cv(128, 128, (g, w, h) => { const gr = g.createRadialGradient(64, 64, 2, 64, 64, 62); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }));
const ctrlHalo = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 2.5), new THREE.MeshBasicMaterial({map: haloTex, color: new THREE.Color(0x4ff0d2).multiplyScalar(0.35), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
ctrlHalo.rotation.x = -Math.PI / 2; ctrlHalo.renderOrder = 3; scene.add(ctrlHalo);

const keyTop = (id, ox = 0, oz = 0) => V3(KEYS[id].cx + ox, CAP_TOP, KEYS[id].cz + oz);

/* ---------- set dressing behind the keyboard (all out of focus) ---------- */
const stage = new THREE.Group(); scene.add(stage);
(function () {
  // monitor
  const scrC = cv(512, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#3a5fb0'); gr.addColorStop(.55, '#1f3772'); gr.addColorStop(1, '#12204a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.10)'; for (let i = 0; i < 9; i++) g.fillRect(24, 24 + i * 24, 60 + ((i * 97) % 220), 9); });
  const bez = new THREE.Mesh(new RoundedBoxGeometry(34, 20, 1.2, 2, 0.4), new THREE.MeshStandardMaterial({color: 0x111216, roughness: 0.4, metalness: 0.5}));
  bez.position.set(11.5, 14.5, -12.5); bez.rotation.x = -0.06; stage.add(bez);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(32, 18), new THREE.MeshBasicMaterial({map: tex(scrC), color: new THREE.Color(1.8, 1.8, 1.8)}));
  scr.position.set(11.5, 14.5, -11.85); scr.rotation.x = -0.06; stage.add(scr);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(3, 8, 1.2), bez.material); stand.position.set(11.5, 4.2, -13.2); stage.add(stand);
  const foot = new THREE.Mesh(new RoundedBoxGeometry(14, 0.5, 6, 2, 0.2), bez.material); foot.position.set(11.5, 0.55, -12); stage.add(foot);
  // mug
  const mug = new THREE.Group();
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.1, 5.8, 40), new THREE.MeshStandardMaterial({color: 0xe8e2d6, roughness: 0.35, envMapIntensity: 1.0})); cup.position.y = 2.9; mug.add(cup);
  const coffee = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.1, 32), new THREE.MeshStandardMaterial({color: 0x2a160c, roughness: 0.2})); coffee.position.y = 5.55; mug.add(coffee);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.38, 10, 24), cup.material); handle.position.set(2.4, 3, 0); mug.add(handle);
  mug.position.set(0.2, MAT_Y, -6.2); stage.add(mug);
  // plant
  const plant = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 2.5, 5, 28), new THREE.MeshStandardMaterial({color: 0xc07a52, roughness: 0.8})); pot.position.y = 2.5; plant.add(pot);
  const leafMat = new THREE.MeshStandardMaterial({color: 0x3c8a4e, roughness: 0.6, side: THREE.DoubleSide});
  const r = mulberry32(55);
  for (let i = 0; i < 16; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), leafMat); const a = r() * TAU, rr = 0.8 + r() * 1.6; l.scale.set(0.9, 3 + r() * 2, 0.35); l.position.set(Math.cos(a) * rr, 7.6 + r() * 2.5, Math.sin(a) * rr); l.rotation.z = Math.cos(a) * 0.7; l.rotation.x = -Math.sin(a) * 0.7; plant.add(l); }
  plant.position.set(21.5, MAT_Y, -7.5); stage.add(plant);
  // warm bokeh lights far behind
  const bk = new THREE.MeshBasicMaterial({color: new THREE.Color(1, 0.62, 0.3).multiplyScalar(6)});
  const bk2 = new THREE.MeshBasicMaterial({color: new THREE.Color(0.5, 0.65, 1).multiplyScalar(4)});
  const rr = mulberry32(99);
  for (let i = 0; i < 14; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 6), i % 3 ? bk : bk2); s.position.set(-8 + rr() * 44, 12 + rr() * 14, -26 - rr() * 14); stage.add(s); }
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(220, 90), new THREE.MeshStandardMaterial({color: 0x1a1618, roughness: 1})); wall.position.set(10, 30, -48); stage.add(wall);
})();
stage.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* ============================================================
   PK 貓貓 — golden-shaded chubby cat, teal collar, gold "PK" tag
   built procedurally: units are cm, feet at y=0, facing +z
   ============================================================ */
const FUR = {base: '#f0a24d', dark: '#d2701f', mid: '#e48f3a', light: '#f8c885', cream: '#fbe4bf'};

function furNoiseC() {
  return cv(512, 512, (g, w, h) => {
    g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); const r = mulberry32(11);
    for (let i = 0; i < 14000; i++) {
      const x = r() * w, y = r() * h, a = r() * TAU, l = 4 + r() * 9, v = r() < .5 ? 40 + r() * 50 : 170 + r() * 70;
      g.strokeStyle = `rgba(${v},${v},${v},${0.25 + r() * 0.35})`; g.lineWidth = 1 + r() * 0.8;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  });
}
function furStrokes(g, w, h, seed, n, areaFn) {
  const r = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * h, a = r() * TAU, l = 3 + r() * 7, d = r() < .5;
    g.strokeStyle = d ? `rgba(150,70,15,${0.05 + r() * .09})` : `rgba(255,236,200,${0.06 + r() * .1})`;
    g.lineWidth = 1.1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
}
function headTex() {                       // equirect: front of face at u=.25, v=.5
  return cv(1024, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#e58a33'); gr.addColorStop(.38, '#f2a650'); gr.addColorStop(.62, '#f7c27c'); gr.addColorStop(1, '#fbd9a4');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const fx = w * 0.25;
    // cream muzzle / cheeks fluff
    let rg = g.createRadialGradient(fx, h * .66, 4, fx, h * .66, 120); rg.addColorStop(0, 'rgba(255,238,208,.95)'); rg.addColorStop(1, 'rgba(255,238,208,0)'); g.fillStyle = rg; g.fillRect(0, 0, w, h);
    for (const s of [-1, 1]) { rg = g.createRadialGradient(fx + s * 105, h * .62, 4, fx + s * 105, h * .62, 90); rg.addColorStop(0, 'rgba(255,225,180,.7)'); rg.addColorStop(1, 'rgba(255,225,180,0)'); g.fillStyle = rg; g.fillRect(0, 0, w, h); }
    // forehead tabby stripes + M
    g.lineCap = 'round';
    for (let i = -3; i <= 3; i++) {
      const x = fx + i * 17, len = 78 - Math.abs(i) * 11;
      g.strokeStyle = `rgba(190,92,22,${0.78 - Math.abs(i) * .07})`; g.lineWidth = 9 - Math.abs(i) * 0.8;
      g.beginPath(); g.moveTo(x, h * .08 + Math.abs(i) * 8); g.quadraticCurveTo(x + i * 2, h * .08 + len * .55, x + i * 1.5, h * .08 + len); g.stroke();
    }
    // cheek stripes
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
      g.strokeStyle = 'rgba(196,98,26,.62)'; g.lineWidth = 7 - i; g.beginPath();
      g.moveTo(fx + s * (118 + i * 5), h * (.56 + i * .045)); g.quadraticCurveTo(fx + s * (165 + i * 8), h * (.575 + i * .05), fx + s * (200 + i * 10), h * (.57 + i * .05)); g.stroke();
    }
    // eye-corner lines
    for (const s of [-1, 1]) { g.strokeStyle = 'rgba(190,92,22,.5)'; g.lineWidth = 5; g.beginPath(); g.moveTo(fx + s * 70, h * .46); g.quadraticCurveTo(fx + s * 105, h * .45, fx + s * 130, h * .47); g.stroke(); }
    furStrokes(g, w, h, 5, 26000);
  });
}
function bodyTex() {
  return cv(1024, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#e58c35'); gr.addColorStop(.5, '#f0a04b'); gr.addColorStop(1, '#f6bf78');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const fx = w * .25;
