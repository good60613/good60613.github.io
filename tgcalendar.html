<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=3.0">
    <title>台中場地8月活動統整行事曆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .update-info {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 20px;
        }

        .update-info-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-info-title::before {
            content: "📝";
            font-size: 1.1rem;
        }

        .update-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .update-item {
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.95rem;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .update-item:last-child {
            border-bottom: none;
        }

        .update-date {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .update-content {
            flex: 1;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 20px 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .legend {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .legend-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .legend-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 5px;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .legend-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .legend-item:active {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .venue-checkbox {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            cursor: pointer;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e9ecef;
            padding: 15px 10px;
        }

        .day-header {
            background: #343a40;
            color: white;
            padding: 12px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .day-cell {
            background: white;
            min-height: 140px;
            padding: 8px 6px;
            border-radius: 6px;
            position: relative;
            transition: all 0.2s ease;
        }

        .day-cell:active {
            transform: scale(0.98);
        }

        .day-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 6px;
            text-align: center;
        }

        .event {
            background: #3498db;
            color: white;
            padding: 4px 6px;
            margin: 3px 0;
            border-radius: 4px;
            font-size: 0.7rem;
            line-height: 1.3;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            word-break: break-word;
            -webkit-tap-highlight-color: rgba(0,0,0,0.1);
        }

        .event:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .event.jukuya { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .event.toyroom { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .event.gengyiroom { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .event.think { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .event.zoo { background: linear-gradient(135deg, #34495e, #2c3e50); }

        .event-venue {
            font-weight: bold;
            font-size: 0.65rem;
            opacity: 0.9;
            margin-bottom: 1px;
        }

        .event-title {
            margin: 1px 0;
            font-size: 0.7rem;
        }

        .event-time {
            font-size: 0.6rem;
            opacity: 0.8;
            margin-top: 1px;
        }

        .today {
            background: linear-gradient(135deg, #fff3cd, #ffeaa7) !important;
            border: 2px solid #f1c40f;
        }

        .past-day {
            opacity: 0.6;
        }

        .past-day .day-number {
            color: #999;
        }

        .event.past {
            background: #999 !important;
            color: #ccc !important;
            cursor: not-allowed;
        }

        .event.past:hover {
            transform: none;
            box-shadow: none;
        }

        .event.past:active {
            transform: none;
            opacity: 1;
        }

        .register-icon {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255, 255, 255, 0.9);
            color: #2c3e50;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
        }

        .age-verification-modal {
            display: flex;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .age-verification-content {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .age-verification-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .age-verification-text {
            font-size: 1.1rem;
            color: #34495e;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .age-verification-disclaimer {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #3498db;
        }

        .age-verification-disclaimer p {
            font-size: 0.9rem;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }

        .age-verification-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .age-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .age-btn-yes {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .age-btn-yes:hover {
            background: linear-gradient(135deg, #27ae60, #229954);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .age-btn-no {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .age-btn-no:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .age-btn:active {
            transform: scale(0.98);
        }

        .modal-content {
            background: white;
            margin: 20px auto;
            padding: 25px 20px;
            border-radius: 12px;
            width: calc(100% - 40px);
            max-width: 400px;
            position: relative;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .close:active {
            background: #f0f0f0;
            color: #333;
        }

        .register-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-top: 15px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .register-button.disabled {
            background: #999 !important;
            color: #ccc !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .register-button.disabled:active {
            transform: none;
            opacity: 1;
        }

        /* 手機橫向模式優化 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
                font-size: 13px;
            }
            
            .calendar-grid {
                padding: 10px 5px;
            }
            
            .day-cell {
                min-height: 120px;
                padding: 5px 4px;
            }
            
            .day-header {
                padding: 10px 3px;
                font-size: 0.8rem;
            }
            
            .event {
                font-size: 0.65rem;
                padding: 3px 4px;
                margin: 2px 0;
            }
            
            .event-venue {
                font-size: 0.6rem;
            }
            
            .event-title {
                font-size: 0.65rem;
            }
            
            .event-time {
                font-size: 0.55rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.85rem;
            }

            .legend {
                padding: 12px;
            }

            .legend-items {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .legend-item {
                font-size: 0.8rem;
            }
        }

        /* 小螢幕手機優化 */
        @media (max-width: 480px) {
            .day-cell {
                min-height: 100px;
                padding: 4px 3px;
            }
            
            .event {
                font-size: 0.6rem;
                padding: 2px 3px;
            }
            
            .event-venue {
                font-size: 0.55rem;
            }
            
            .event-title {
                font-size: 0.6rem;
            }
            
            .event-time {
                font-size: 0.5rem;
            }

            .day-header {
                padding: 8px 2px;
                font-size: 0.75rem;
            }

            .modal-content {
                margin: 10px;
                width: calc(100% - 20px);
                padding: 20px 15px;
            }
        }

        /* 觸控優化 */
        @media (hover: none) and (pointer: coarse) {
            .event:hover {
                transform: none;
                box-shadow: none;
            }
            
            .day-cell:hover {
                transform: none;
                box-shadow: none;
            }
        }

        /* 確保文字可讀性 */
        @media (prefers-color-scheme: dark) {
            .modal-content {
                background: #1a1a1a;
                color: #ffffff;
            }
            
            .close {
                color: #cccccc;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>台中場地8月活動統整行事曆</h1>
            <p>2025年8月 • 更新日期：2025.08.05</p>
        </div>

        <div class="legend">

                    <div class="legend-color" style="background: linear-gradient(135deg, #e74c3c, #c0392b);"></div>
                    <span>拘久屋</span>
                </div>
                <div class="legend-item" data-venue="toyroom" onclick="toggleVenue('toyroom')">
                    <input type="checkbox" class="venue-checkbox" id="toyroom-checkbox" checked>
                    <div class="legend-color" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);"></div>
                    <span>玩具間</span>
                </div>
                <div class="legend-item" data-venue="gengyiroom" onclick="toggleVenue('gengyiroom')">
                    <input type="checkbox" class="venue-checkbox" id="gengyiroom-checkbox" checked>
                    <div class="legend-color" style="background: linear-gradient(135deg, #f39c12, #e67e22);"></div>
                    <span>更衣間</span>
                </div>
                <div class="legend-item" data-venue="think" onclick="toggleVenue('think')">
                    <input type="checkbox" class="venue-checkbox" id="think-checkbox" checked>
                    <div class="legend-color" style="background: linear-gradient(135deg, #2ecc71, #27ae60);"></div>
                    <span>思</span>
                </div>
                <div class="legend-item" data-venue="zoo" onclick="toggleVenue('zoo')">
                    <input type="checkbox" class="venue-checkbox" id="zoo-checkbox" checked>
                    <div class="legend-color" style="background: linear-gradient(135deg, #34495e, #2c3e50);"></div>
                    <span>動物方程式</span>
                </div>
            </div>
        </div>

        <div class="calendar-grid" id="calendar">
            <!-- Calendar will be generated by JavaScript -->
        </div>

        <div class="update-info">
            <div class="update-info-title">更新資訊</div>
            <ul class="update-list">
                <li class="update-item">
                    <span class="update-date">8/20</span>
                    <span class="update-content">新增活動</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- 年齡驗證彈窗 -->
    <div id="ageVerificationModal" class="age-verification-modal">
        <div class="age-verification-content">
            <div class="age-verification-title">年齡確認</div>
            <div class="age-verification-text">
                您是否已年滿18歲？
            </div>
            <div class="age-verification-disclaimer">
                <p><strong>免責聲明：</strong></p>
                <p>本活動日曆僅協助整理、活動規章與解釋權歸主辦方所有</p>
            </div>
            <div class="age-verification-buttons">
                <button class="age-btn age-btn-yes" onclick="confirmAge(true)">
                    ✓ 是，我已年滿18歲
                </button>
                <button class="age-btn age-btn-no" onclick="confirmAge(false)">
                    ✗ 否，我未滿18歲
                </button>
            </div>
        </div>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

            { date: 16, venue: '動物方程式', title: 'Soa的進階繩課 🔅', time: '14:00~16:30', class: 'zoo', link: 'https://t.co/fs48unuleS' },
            { date: 17, venue: '動物方程式', title: 'SP拍賣會 🔅', time: '14:00~17:00', class: 'zoo', link: 'https://t.co/KofUQtcIOR' },
            { date: 20, venue: '動物方程式', title: '練繩日 🌙', time: '19:00~22:00', class: 'zoo', link: 'https://t.co/KVM5qvXWK0' },
            { date: 23, venue: '動物方程式', title: '人改&穿刺實作交流分享 🔅', time: '14:00~17:00', class: 'zoo', link: 'https://t.co/uxlRmy5Z1g' },
            { date: 23, venue: '動物方程式', title: '邂逅角落 🌙', time: '19:00~22:00', class: 'zoo', link: 'https://t.co/KVM5qvXWK0' },
            { date: 29, venue: '動物方程式', title: '新手入圈聊天室 🌙', time: '19:30~21:30', class: 'zoo', link: 'https://t.co/KVM5qvXWK0' },
            { date: 30, venue: '動物方程式', title: '練繩日 🔅', time: '14:00~17:00', class: 'zoo', link: 'https://t.co/KVM5qvXWK0' }
        ];

        function toggleVenue(venueClass) {
            venueVisibility[venueClass] = !venueVisibility[venueClass];
            const checkbox = document.getElementById(venueClass + '-checkbox');
            checkbox.checked = venueVisibility[venueClass];
            
            // Regenerate calendar with updated visibility
            document.getElementById('calendar').innerHTML = '';
            generateCalendar();
        }

        function getCurrentDate() {
            const today = new Date();
            return today.getDate();
        }

        function isPastDate(day) {
            const today = getCurrentDate();
            return day < today;
        }

        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
            
            // Add day headers
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // August 2025 starts on Friday (day 5), so we need 5 empty cells for July
            const firstDayOfMonth = 5; // Friday
            const daysInMonth = 31;
            
            // Add empty cells for previous month
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell other-month';
                calendar.appendChild(emptyCell);
            }

            // Add days of the month
            const today = getCurrentDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                
                // Check if today (based on current date)
                if (day === today) {
                    dayCell.classList.add('today');
                } else if (isPastDate(day)) {
                    dayCell.classList.add('past-day');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayCell.appendChild(dayNumber);

                // Add events for this day and sort by start time
                const dayEvents = events.filter(event => event.date === day && venueVisibility[event.class]);
                
                // Sort events by start time
                dayEvents.sort((a, b) => {
                    // Extract start time from time string (e.g., "14:00~18:00" -> "14:00")
                    const getStartTime = (timeStr) => {
                        const match = timeStr.match(/(\d{1,2}):(\d{2})/);
                        if (match) {
                            return parseInt(match[1]) * 60 + parseInt(match[2]); // Convert to minutes
                        }
                        return 0; // Default for non-standard time formats
                    };
                    
                    return getStartTime(a.time) - getStartTime(b.time);
                });
                
                dayEvents.forEach(event => {
                    const eventDiv = document.createElement('div');
                    const isPast = isPastDate(day);
                    eventDiv.className = `event ${event.class}${isPast ? ' past' : ''}`;
                    eventDiv.style.position = 'relative';
                    eventDiv.innerHTML = `
                        <div class="event-venue">${event.venue}</div>
                        <div class="event-title">${event.title}</div>
                        <div class="event-time">${event.time}</div>
                        ${event.link && !isPast ? '<div class="register-icon">🔗</div>' : ''}
                    `;
                    
                    if (!isPast) {
                        eventDiv.addEventListener('click', () => showEventDetails(event));
                        // 添加觸控回饋
                        eventDiv.addEventListener('touchstart', function() {
                            this.style.opacity = '0.7';
                        });
                        eventDiv.addEventListener('touchend', function() {
                            this.style.opacity = '1';
                        });
                    }
                    
                    dayCell.appendChild(eventDiv);
                });

                calendar.appendChild(dayCell);
            }
        }

        function showEventDetails(event) {
            const modal = document.getElementById('eventModal');
            const modalContent = document.getElementById('modalContent');
            
            const isPast = isPastDate(event.date);
            let linkButton = '';
            
            if (event.link) {
                if (isPast) {
                    linkButton = `<div class="register-button disabled">
                        ❌ 活動已結束
                    </div>`;
                } else {
                    linkButton = `<a href="${event.link}" target="_blank" class="register-button">
                        🔗 前往報名
                    </a>`;
                }
            }
            
            modalContent.innerHTML = `
                <h2 style="color: ${isPast ? '#999' : '#2c3e50'}; margin-bottom: 8px; font-size: 1.3rem;">${event.venue}</h2>
                <h3 style="color: ${isPast ? '#aaa' : '#34495e'}; margin-bottom: 12px; font-size: 1.1rem;">${event.title}${isPast ? ' (已結束)' : ''}</h3>
                <p style="margin-bottom: 6px; font-size: 0.95rem; color: ${isPast ? '#999' : 'inherit'};"><strong>日期：</strong>8月${event.date}日</p>
                <p style="margin-bottom: 12px; font-size: 0.95rem; color: ${isPast ? '#999' : 'inherit'};"><strong>時間：</strong>${event.time}</p>
                ${linkButton}
            `;
            
            modal.style.display = 'block';
            // 防止背景滾動
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Modal close functionality
        document.querySelector('.close').addEventListener('click', closeModal);

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('eventModal');
            if (event.target === modal) {
                closeModal();
            }
        });

        // 添加觸控支援
        document.querySelector('.close').addEventListener('touchend', function(e) {
            e.preventDefault();
            closeModal();
        });

        // 防止模態框內容點擊時關閉
        document.querySelector('.modal-content').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // Prevent checkbox from toggling when clicked directly
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('.venue-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const venueClass = this.id.replace('-checkbox', '');
                    toggleVenue(venueClass);
                });
            });
        });

        // Generate calendar on page load
        generateCalendar();

        // 優化觸控體驗
        if ('ontouchstart' in window) {
            document.body.classList.add('touch-device');
        }
    </script>
</body>
</html>
